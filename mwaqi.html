<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عنوان الموقع</title>
    <style>
 body {background-color: #ccc;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;}
  .btn-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-top: 20px;
        }

        .btn-box a {
            text-decoration: none;
            color: white;
            background-color: steelblue;
            padding: 10px 18px;
            border-radius: 10px;
            border: 2px solid #ccc;
            margin: 0;
            font-size: 15px;
            font-weight: bold;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-box a:active {
            transform: scale(0.95);
            background-color: #2c5282;
        }
    </style>
</head>
<body>
<div class="btn-box">
            <a href="https://ahsget6-create.github.io/sharia-app/">موقع منصة العلوم الشرعية</a>
</div>

</body>
</html>
