<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <!-- وسام التجاوب الأساسي للجوالات والأجهزة المختلفة -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة تعريفية</title>
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0f172a;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }
      .profile-card {
        width: 100%;
        max-width: 380px;
        padding: 30px 20px;
        background-color: #1e293b;
        color: #ffffff;
        border: 1px solid #334155;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        text-align: center;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .profile-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 30px rgba(56, 189, 248, 0.3);
      }
      .avatar {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        background-color: #38bdf8;
        display: flex;
        margin: 0 auto 15px auto;
        box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      }
      .name {
        font-size: 22px;
        margin: 0 0 5px 0;
        color: white;
      }
      .title {
        color: #94a3b8;
        font-size: 15px;
        margin-bottom: 20px;
      }
      .btn-contact {
        width: 100%;
        color: #0f172a;
        background-color: #38bdf8;
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .btn-contact:hover {
        background-color: #0ea5e9;
      }
    </style>
  </head>
  <body>
    <div class="profile-card">
      <div class="avatar">👨‍💻</div>
      <h2 class="name">alhassn abdulazeez</h2>
      <p class="title">مطور واجهات ويب</p>
      <button class="btn-contact">تواصل معي</button>
    </div>
  </body>
</html>
