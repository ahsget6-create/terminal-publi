<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة جانبية (sidebar)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #fff;
        }

        /* زر فتح القائمة (الثلاث شرطات) */
        .menu-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            background-color: #e2e8f0;
            border: none;
            padding: 10px 15px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 100;
        }

        /* القائمة الجانبية وتصميمها */
        .sidebar {
            position: fixed;
            top: 0;
            right: -250px;
            width: 250px;
            height: 100%;
            background-color: #474747;
            transition: right 0.3s ease;
            z-index: 2000;
            box-sizing: border-box;
            padding-top: 20px;
            text-align: right;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 17px;
            color: black;
            display: block;
        }

        .sidebar a:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 25px;
            color: black;
            cursor: pointer;
            padding: 10px 20px;
            display: block;
            margin-bottom: 10px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 1500;
        }

        .overlay.active {
            visibility: visible;
            opacity: 1;
        }
      .back-to-designs{position:fixed;
                      text-decoration:none;
                      background-color:#e2e8f0;
                      color:black;
                      border:1px solid lightgray;
              border-radius:10px;
                box-shadow:0 5px 10px rgba(0,0,0,0.1);
          font-size:15px;
        padding:10px;      cursor:pointer; }
    </style>
</head>
<body>
<h5>تصميم من تصاميمي للsidebar:</h5>
    <!-- زر فتح القائمة -->
    <button class="menu-btn" onclick="toggleMenu()">☰</button>

    <!-- القائمة الجانبية -->
    <div class="sidebar" id="mySidebar">
        <button class="close-btn" onclick="toggleMenu()">&times;</button>
        <a href="index.html">🏠 الرئيسية</a>
        <a href="designs.html">🎨 معرض التصاميم</a>
        <a href="#" onclick="toggleMenu()">📐 مشروع الـ sidebar</a>
      <a href="index.html#contact">📩 تواصل معي</a>
    </div>

    <!-- طبقة الظل الخلفية -->
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<a href="designs.html" class="back-to-designs">العودة للتصاميم</a>
    <script>
        function toggleMenu() {
            var sidebar = document.getElementById("mySidebar");
            var overlay = document.getElementById("overlay");
            
            sidebar.classList.toggle("active");
            overlay.classList.toggle("active");
        }
    </script>
</body>
</html>
